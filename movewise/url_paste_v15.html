<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoveWise v15</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef2f7;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#0f172a}#wrap{width:100%;height:100%;position:relative}#appFrame{width:100%;height:100%;border:0;display:block}.boot{position:absolute;left:18px;top:18px;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:10px 14px;box-shadow:0 8px 24px #0f172a1a;font-size:14px;z-index:3}.spinner{display:inline-block;width:16px;height:16px;border:3px solid #cbd5e1;border-top-color:#0f766e;border-radius:50%;animation:spin 1s linear infinite;vertical-align:-4px;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="wrap">
  <div id="boot" class="boot"><span class="spinner"></span>MoveWise v15を読み込み中です...</div>
  <iframe id="appFrame" src="https://rawcdn.githack.com/yojiro1117/-txt/a83f057977507d087780665803f293b399dddaa3/movewise/url_paste_v14.html"></iframe>
</div>
<script>
(function(){
  var frame=document.getElementById('appFrame');
  var boot=document.getElementById('boot');
  var injected=false;
  function tryInject(){
    if(injected)return;
    var w,d;
    try{w=frame.contentWindow;d=frame.contentDocument||w.document}catch(e){return}
    if(!w||!d||!w.calc||!w.render||!d.getElementById('routeText'))return;
    injected=true;
    if(boot)boot.style.display='none';

    function removeSubtitle(){try{var p=d.querySelector('.top p');if(p){p.textContent='';p.style.display='none';}}catch(e){}}
    removeSubtitle();

    var style=d.createElement('style');
    style.id='v15Style';
    style.textContent='.googleExactPanel{margin-top:10px;padding:12px;border:2px solid #0f766e;border-radius:14px;background:#ecfdf5}.googleExactPanel h3{font-size:14px;margin:0 0 8px;color:#065f46}.googleExactGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.googleExactPanel .field span{font-size:11px;font-weight:900;color:#065f46}.googleExactNote{font-size:12px;color:#065f46;line-height:1.55;margin-top:8px}.googleExactWarn{margin-top:8px;padding:9px;border-radius:12px;background:#fffbeb;border:1px solid #fcd34d;color:#92400e;font-size:12px;line-height:1.55}.googleLockBadge{font-size:10px;color:#0f766e;font-weight:900;margin-left:6px}.googleManualRoute .routeMeta,.googleManualRoute .sub{color:#0f766e!important;font-weight:800}.googleManualBanner{margin:8px 0;padding:8px;border:1px solid #a7f3d0;border-radius:12px;background:#f0fdfa;color:#065f46;font-size:12px;font-weight:800}.miniRoute h3 .muted{max-width:220px;text-align:right}';
    d.head.appendChild(style);

    w.googleExactOverride={enabled:false,distanceKm:null,durationMin:null,tollYen:null};
    function parseTimeToMin(s){
      s=String(s||'').replace(/\s+/g,'');
      var m=s.match(/(\d+)時間(\d+)?分?/); if(m)return Number(m[1])*60+(m[2]?Number(m[2]):0);
      m=s.match(/(\d+)分/); if(m)return Number(m[1]);
      m=s.match(/^(\d+):(\d+)$/); if(m)return Number(m[1])*60+Number(m[2]);
      m=s.match(/^(\d+)$/); if(m)return Number(m[1]);
      return null;
    }
    function parseKm(s){
      s=String(s||'');
      var m=s.match(/(\d+(?:\.\d+)?)\s*km/i); if(m)return Number(m[1]);
      m=s.match(/(\d+(?:\.\d+)?)\s*キロ/); if(m)return Number(m[1]);
      m=s.match(/^(\d+(?:\.\d+)?)$/); if(m)return Number(m[1]);
      return null;
    }
    function parseYen(s){
      s=String(s||'');
      var m=s.match(/(\d{1,3}(?:,\d{3})*|\d+)\s*円/); if(m)return Number(m[1].replace(/,/g,''));
      m=s.match(/^(\d+)$/); if(m)return Number(m[1]);
      return null;
    }
    function installGoogleExactPanel(){
      if(d.getElementById('googleExactPanel'))return;
      var rt=d.getElementById('routeText');
      var parent=rt?rt.closest('.sidebody'):null;
      if(!parent)return;
      var panel=d.createElement('div');
      panel.className='googleExactPanel';
      panel.id='googleExactPanel';
      panel.innerHTML='<h3>Googleマップ表示値を正として採用</h3><div class="googleExactGrid"><label class="field"><span>Google距離</span><input id="gExactKm" placeholder="例：107 または 107km"></label><label class="field"><span>Google移動時間</span><input id="gExactTime" placeholder="例：2時間17分"></label></div><label class="field"><span>Google有料道路料金</span><input id="gExactToll" placeholder="例：820円 任意"></label><div class="btns"><button class="btn teal" id="gExactApply">Google値を本アプリへ反映</button><button class="btn secondary" id="gExactClear">解除</button></div><div class="googleExactNote">Googleマップ表示の距離・時間を入力すると、本アプリの総距離・移動時間・完了予定をGoogle値に合わせます。</div><div class="googleExactWarn">APIなし・ローカル補助アプリなしでは、ブラウザの制限によりGoogleマップ iframe 内の時間を自動取得できません。完全一致させるには、ここへGoogleマップ表示値を貼り付けて反映します。</div>';
      parent.appendChild(panel);
      d.getElementById('gExactApply').onclick=function(){
        var km=parseKm(d.getElementById('gExactKm').value);
        var min=parseTimeToMin(d.getElementById('gExactTime').value);
        var toll=parseYen(d.getElementById('gExactToll').value);
        if(km==null&&min==null&&toll==null){w.notice&&w.notice('Googleマップの距離または移動時間を入力してください。');return;}
        w.googleExactOverride={enabled:true,distanceKm:km,durationMin:min,tollYen:toll};
        if(w.parsedRouteOverride){
          if(km!=null)w.parsedRouteOverride.distanceKm=km;
          if(min!=null)w.parsedRouteOverride.durationMin=min;
          if(toll!=null)w.parsedRouteOverride.tollYen=toll;
        }
        w.render();
        w.notice&&w.notice('Googleマップ表示値を本アプリの正値として反映しました。');
      };
      d.getElementById('gExactClear').onclick=function(){
        w.googleExactOverride={enabled:false,distanceKm:null,durationMin:null,tollYen:null};
        if(w.parsedRouteOverride){w.parsedRouteOverride={distanceKm:null,durationMin:null,tollYen:null};}
        d.getElementById('gExactKm').value='';d.getElementById('gExactTime').value='';d.getElementById('gExactToll').value='';
        w.render();
        w.notice&&w.notice('Google値の上書きを解除しました。');
      };
    }

    var oldCalc=w.calc;
    w.calc=function(){
      var c=oldCalc();
      var g=w.googleExactOverride||{};
      if(g.enabled){
        if(g.distanceKm!=null)c.totals.displayKm=g.distanceKm;
        if(g.durationMin!=null){c.totals.displayMove=g.durationMin;c.totals.displayTotal=g.durationMin+c.totals.stay;c.totals.finish=w.tm? w.tm(d.getElementById('startTime').value||'09:00',c.totals.displayTotal):c.totals.finish;}
        if(g.tollYen!=null)c.totals.toll=g.tollYen;
      }
      return c;
    };

    var oldRenderMini=w.renderMiniRoute;
    if(oldRenderMini){
      w.renderMiniRoute=function(c){
        oldRenderMini(c);
        var g=w.googleExactOverride||{};
        var box=d.getElementById('routeMini');
        var total=d.getElementById('routeMiniTotal');
        if(g.enabled){
          if(total)total.innerHTML=String(c.totals.displayKm)+'km / '+w.fmt(c.totals.displayTotal)+' <span class="googleLockBadge">Google値</span>';
          if(box&&!box.querySelector('.googleManualBanner')){
            var banner=d.createElement('div');
            banner.className='googleManualBanner';
            banner.textContent='Googleマップ表示値を正として採用中です。';
            box.insertBefore(banner,box.firstChild);
          }
          if(box)box.classList.add('googleManualRoute');
        }else if(box){box.classList.remove('googleManualRoute');}
      };
    }

    var oldRender=w.render;
    w.render=function(){
      oldRender();
      removeSubtitle();
      installGoogleExactPanel();
      var g=w.googleExactOverride||{};
      if(g.enabled){
        var c=w.calc();
        var sk=d.getElementById('sKm'), sm=d.getElementById('sMove'), st=d.getElementById('sTotal'), sf=d.getElementById('sFinish'), mm=d.getElementById('mMove'), mt=d.getElementById('mToll');
        if(sk)sk.textContent=String(c.totals.displayKm)+'km*';
        if(sm)sm.textContent=w.fmt(c.totals.displayMove)+'*';
        if(st)st.textContent=w.fmt(c.totals.displayTotal)+'*';
        if(sf)sf.textContent=c.totals.finish;
        if(mm)mm.textContent=w.fmt(c.totals.displayMove)+'*';
        if(mt&&g.tollYen!=null)mt.textContent='Google '+Number(g.tollYen).toLocaleString()+'円';
      }
    };

    installGoogleExactPanel();
    w.render();
    w.notice&&w.notice('v15を適用しました。Googleマップ表示値を本アプリの正値として反映できます。');
  }
  frame.addEventListener('load',function(){setTimeout(tryInject,800);setTimeout(tryInject,2000);setTimeout(tryInject,4000)});
  setInterval(function(){if(!injected)tryInject()},1500);
})();
</script>
</body>
</html>
