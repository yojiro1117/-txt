<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoveWise｜GoogleマップURL貼付対応版 v3</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#eef2f7;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#0f172a}.loading{padding:24px}.err{margin:24px;padding:16px;border-radius:14px;background:#fff1f2;border:1px solid #fecdd3;color:#9f1239}.spinner{display:inline-block;width:18px;height:18px;border:3px solid #cbd5e1;border-top-color:#0f766e;border-radius:50%;animation:spin 1s linear infinite;vertical-align:-4px;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="loading"><span class="spinner"></span>MoveWiseを読み込み中です...</div>
<script>
(async()=>{
  const baseUrl='https://rawcdn.githack.com/yojiro1117/-txt/6387954406d2135916bba02ac8076a791ead1229/movewise/url_paste_v2.html';
  const patch=`
<script>
(function(){
  function _mwDecode(s){try{return decodeURIComponent(String(s||'').replace(/\\+/g,' '))}catch(e){return String(s||'')}}
  function _hasUrl(s){return /https?:\\/\\/|www\\.|google\\.(?:co\\.jp|com)\\/maps|maps\\.app\\.goo\\.gl|\\/maps\\//i.test(String(s||''))}
  function _stripUrls(s){return String(s||'').replace(/https?:\\/\\/\\S+/g,' ').replace(/www\\.\\S+/g,' ').replace(/google\\.(?:co\\.jp|com)\\/maps\\S*/ig,' ').replace(/maps\\.app\\.goo\\.gl\\S*/ig,' ')}
  function _cleanAddress(s){return String(s||'').replace(/^〒\\s*\\d{3}-?\\d{4}\\s*/,'').replace(/[\\[\\]{}<>]/g,'').replace(/\\s+/g,' ').trim().replace(/^(日本|Japan)\\s*/i,'')}
  const pref='北海道|東京都|京都府|大阪府|青森県|岩手県|宮城県|秋田県|山形県|福島県|茨城県|栃木県|群馬県|埼玉県|千葉県|神奈川県|新潟県|富山県|石川県|福井県|山梨県|長野県|岐阜県|静岡県|愛知県|三重県|滋賀県|兵庫県|奈良県|和歌山県|鳥取県|島根県|岡山県|広島県|山口県|徳島県|香川県|愛媛県|高知県|福岡県|佐賀県|長崎県|熊本県|大分県|宮崎県|鹿児島県|沖縄県';
  const addrRe=new RegExp('(?:〒\\s*\\d{3}-?\\d{4}\\s*)?(('+pref+')[^\\n\\r,，]*?(?:市|区|町|村)[^\\n\\r,，]*)');
  window.extractAddress=function(text){
    const raw=String(text||'');
    const decoded=_mwDecode(raw);
    const withoutUrl=_stripUrls(decoded);
    const candidates=withoutUrl.split(/[\\n\\r]+| {2,}|　{2,}|\\t+/).map(_cleanAddress).filter(Boolean);
    for(const line of candidates){
      const m=line.match(addrRe);
      if(m){
        const a=_cleanAddress(m[1]);
        if(a.length>=8 && !/maps|google|place|data=|entry=|query=/i.test(a)) return a;
      }
    }
    // URLのみを貼り付けた場合は、Google URL内のエンコード済み文字列から住所を推定しない。
    // 座標は反映し、住所欄は既存値を維持する。
    if(_hasUrl(decoded)) return '';
    const m=withoutUrl.match(addrRe);
    return m?_cleanAddress(m[1]):'';
  };
  window.parseGooglePaste=function(text){
    return {coords:extractCoords(text),label:extractPlaceLabel(text),address:extractAddress(text),route:parseRouteTextCore(text)};
  };
  window.applyParsedToStart=function(parsed){
    if(parsed.label&&!document.getElementById('startName').value.trim())document.getElementById('startName').value=parsed.label;
    if(parsed.address)document.getElementById('startAddress').value=parsed.address;
    if(parsed.coords){document.getElementById('startLat').value=parsed.coords.lat;document.getElementById('startLng').value=parsed.coords.lng;}
  };
  window.applyParsedToDest=function(id,parsed){
    destinations=destinations.map(d=>{
      if(d.id!==id)return d;
      const nd={...d};
      if(parsed.label&&!nd.name)nd.name=parsed.label;
      if(parsed.address)nd.address=parsed.address;
      if(parsed.coords){nd.lat=parsed.coords.lat;nd.lng=parsed.coords.lng;nd.source='Google URL';}
      return nd;
    });
  };
  window.applyPasteToStart=function(){
    const text=document.getElementById('startPaste').value;
    const p=parseGooglePaste(text);
    applyParsedToStart(p);
    const parts=[];
    if(p.coords)parts.push('座標 '+p.coords.lat+', '+p.coords.lng);
    if(p.address)parts.push('住所');
    if(p.label)parts.push('名称候補');
    if(p.route.distanceKm||p.route.durationMin||p.route.tollYen){parsedRouteOverride=p.route;parts.push('ルート情報');}
    const msg=parts.length?'反映：'+parts.join(' / ')+(p.coords&&!p.address?'（住所は上書きしていません）':''):'抽出できませんでした';
    document.getElementById('startPasteStatus').textContent=msg;
    render();
  };
  window.applyPasteToDest=function(id){
    const d=destinations.find(x=>x.id===id);if(!d)return;
    const text=d.paste||'';
    const p=parseGooglePaste(text);
    applyParsedToDest(id,p);
    if(p.route.distanceKm||p.route.durationMin||p.route.tollYen)parsedRouteOverride=p.route;
    renderDests();render();
    if(p.coords&&!p.address)notice('座標のみ反映しました。Google URL内の文字列による住所の誤上書きを防止しています。');
    else notice((p.coords||p.address||p.label||p.route.distanceKm||p.route.durationMin||p.route.tollYen)?'貼付内容を反映しました。':'貼付内容から抽出できませんでした。');
  };
  if(typeof renderDests==='function')renderDests();
  if(typeof render==='function')render();
  if(typeof notice==='function')notice('住所誤抽出防止版を適用しました。URLだけの場合は座標のみ反映します。');
})();
<\/script>`;
  try{
    let html=await (await fetch(baseUrl,{cache:'no-store'})).text();
    html=html.replace('</body>',patch+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<div class="err"><b>読み込みに失敗しました。</b><br>ブラウザを更新してください。<br>'+String(e)+'</div>';
  }
})();
</script>
</body>
</html>
