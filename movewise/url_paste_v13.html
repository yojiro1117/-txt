<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoveWise v13</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef2f7;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#0f172a}#wrap{width:100%;height:100%;position:relative}#appFrame{width:100%;height:100%;border:0;display:block}.boot{position:absolute;left:18px;top:18px;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:10px 14px;box-shadow:0 8px 24px #0f172a1a;font-size:14px;z-index:3}.spinner{display:inline-block;width:16px;height:16px;border:3px solid #cbd5e1;border-top-color:#0f766e;border-radius:50%;animation:spin 1s linear infinite;vertical-align:-4px;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="wrap">
  <div id="boot" class="boot"><span class="spinner"></span>MoveWise v13を読み込み中です...</div>
  <iframe id="appFrame" src="https://rawcdn.githack.com/yojiro1117/-txt/02e1c569f03a84e80ff793c8a8fa2a0535e53a16/movewise/url_paste_v11.html"></iframe>
</div>
<script>
(function(){
  var frame=document.getElementById('appFrame');
  var boot=document.getElementById('boot');
  var injected=false;
  function enc(s){return encodeURIComponent(String(s||'').trim())}
  function escHtml(s){return String(s||'').replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]})}
  function tryInject(){
    if(injected)return;
    var w,d;
    try{w=frame.contentWindow;d=frame.contentDocument||w.document}catch(e){return}
    if(!w||!d||!d.getElementById('mapSvg')||!w.calc||!w.render){return}
    injected=true;
    if(boot)boot.style.display='none';
    var style=d.createElement('style');
    style.id='v13MapStyle';
    style.textContent='.gmapFrame{width:100%;height:430px;border:0;border-radius:14px;background:#e2e8f0}.gmapNote{font-size:12px;color:#64748b;margin-top:8px;line-height:1.55}.gmapTools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.gmapTools .btn{white-space:nowrap}.gmapErr{padding:14px;border:1px dashed #cbd5e1;border-radius:14px;background:#f8fafc;color:#64748b;font-size:13px}';
    d.head.appendChild(style);
    w.buildGoogleMapsEmbedUrl=function(){
      var c=w.calc();
      var pts=[c.start].concat(c.ordered||[]);
      var items=pts.map(function(p,i){
        var lat=Number(p.lat),lng=Number(p.lng);
        if(Number.isFinite(lat)&&Number.isFinite(lng)&&lat!==0&&lng!==0)return lat.toFixed(6)+','+lng.toFixed(6);
        var name=String(p.name||'').trim(),addr=String(p.address||'').trim();
        if(i===0&&w.isCurrent&&w.isCurrent(name))return '現在地';
        return name&&addr?name+' '+addr:(name||addr);
      }).filter(Boolean);
      if(items.length<2)return '';
      return 'https://maps.google.com/maps?saddr='+enc(items[0])+'&daddr='+enc(items.slice(1).join(' to:'))+'&dirflg=d&output=embed';
    };
    w.refreshGoogleMapPreview=function(){
      var iframe=d.getElementById('googleMapPreviewFrame');
      var empty=d.getElementById('googleMapPreviewEmpty');
      if(!iframe)return;
      var url=w.buildGoogleMapsEmbedUrl();
      if(!url){iframe.style.display='none';if(empty)empty.style.display='block';return}
      if(empty)empty.style.display='none';
      iframe.style.display='block';
      if(iframe.src!==url)iframe.src=url;
    };
    w.openEmbedGoogleMapInNewTab=function(){
      var url=w.buildGoogleMapsEmbedUrl();
      if(!url){w.notice&&w.notice('Googleマップ表示用URLを作成できません。');return}
      w.open(url,'_blank','noopener,noreferrer');
    };
    function installCard(){
      if(d.getElementById('googleMapPreviewCard'))return;
      var svg=d.getElementById('mapSvg');
      var baseCard=svg?svg.closest('.card'):null;
      if(!baseCard||!baseCard.parentElement)return;
      var card=d.createElement('section');
      card.className='card';
      card.id='googleMapPreviewCard';
      card.innerHTML='<div class="title"><h2>Googleマップ表示</h2><div class="gmapTools"><button class="btn secondary" id="gmapRefreshBtn">地図を更新</button><button class="btn secondary" id="gmapOpenBtn">Googleマップで開く</button><button class="btn secondary" id="gmapTabBtn">別タブで表示</button></div></div><div id="googleMapPreviewEmpty" class="gmapErr">出発地と目的地の座標または住所を入力すると、ここにGoogleマップを表示します。</div><iframe id="googleMapPreviewFrame" class="gmapFrame" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen style="display:none"></iframe><div class="gmapNote">※APIなしの通常Googleマップ埋め込みです。Google側の仕様により、経路表示・地点名・現在地の扱いが通常タブ表示と異なる場合があります。正式確認は「Googleマップで開く」を使用してください。</div>';
      baseCard.parentElement.insertBefore(card,baseCard.nextSibling);
      d.getElementById('gmapRefreshBtn').onclick=w.refreshGoogleMapPreview;
      d.getElementById('gmapOpenBtn').onclick=w.openGoogleRoute;
      d.getElementById('gmapTabBtn').onclick=w.openEmbedGoogleMapInNewTab;
    }
    installCard();
    var oldRender=w.render;
    w.render=function(){oldRender();installCard();clearTimeout(w.__mwGmapTimer);w.__mwGmapTimer=setTimeout(w.refreshGoogleMapPreview,500)};
    w.render();
    w.notice&&w.notice('v13を適用しました。概略図の下にGoogleマップ表示を追加しました。');
  }
  frame.addEventListener('load',function(){setTimeout(tryInject,800);setTimeout(tryInject,2000);setTimeout(tryInject,4000)});
  setInterval(function(){if(!injected)tryInject()},1500);
})();
</script>
</body>
</html>
