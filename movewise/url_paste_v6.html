<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoveWise｜住所逆引き対応版 v6</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#eef2f7;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#0f172a}.loading{padding:24px}.err{margin:24px;padding:16px;border-radius:14px;background:#fff1f2;border:1px solid #fecdd3;color:#9f1239}.spinner{display:inline-block;width:18px;height:18px;border:3px solid #cbd5e1;border-top-color:#0f766e;border-radius:50%;animation:spin 1s linear infinite;vertical-align:-4px;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="loading"><span class="spinner"></span>MoveWiseを読み込み中です...</div>
<script>
(async()=>{
  const baseUrl='https://rawcdn.githack.com/yojiro1117/-txt/6387954406d2135916bba02ac8076a791ead1229/movewise/url_paste_v2.html';
  const patch=`
<script>
(function(){
  function _mwDecode(s){try{return decodeURIComponent(String(s||'').replace(/\\+/g,' '))}catch(e){return String(s||'')}}
  function _hasUrl(s){return /https?:\\/\\/|www\\.|google\\.(?:co\\.jp|com)\\/maps|maps\\.app\\.goo\\.gl|\\/maps\\//i.test(String(s||''))}
  function _stripUrls(s){return String(s||'').replace(/https?:\\/\\/\\S+/g,' ').replace(/www\\.\\S+/g,' ').replace(/google\\.(?:co\\.jp|com)\\/maps\\S*/ig,' ').replace(/maps\\.app\\.goo\\.gl\\S*/ig,' ')}
  function _cleanAddress(s){return String(s||'').replace(/^〒\\s*\\d{3}-?\\d{4}\\s*/,'').replace(/[\\[\\]{}<>]/g,'').replace(/\\s+/g,' ').trim().replace(/^(日本|Japan)\\s*/i,'')}
  const pref='北海道|東京都|京都府|大阪府|青森県|岩手県|宮城県|秋田県|山形県|福島県|茨城県|栃木県|群馬県|埼玉県|千葉県|神奈川県|新潟県|富山県|石川県|福井県|山梨県|長野県|岐阜県|静岡県|愛知県|三重県|滋賀県|兵庫県|奈良県|和歌山県|鳥取県|島根県|岡山県|広島県|山口県|徳島県|香川県|愛媛県|高知県|福岡県|佐賀県|長崎県|熊本県|大分県|宮崎県|鹿児島県|沖縄県';
  const addrRe=new RegExp('(?:〒\\s*\\d{3}-?\\d{4}\\s*)?(('+pref+')[^\\n\\r,，]*?(?:市|区|町|村)[^\\n\\r,，]*)');
  window.extractAddress=function(text){
    const raw=String(text||'');
    const decoded=_mwDecode(raw);
    const withoutUrl=_stripUrls(decoded);
    const candidates=withoutUrl.split(/[\\n\\r]+| {2,}|　{2,}|\\t+/).map(_cleanAddress).filter(Boolean);
    for(const line of candidates){
      const m=line.match(addrRe);
      if(m){
        const a=_cleanAddress(m[1]);
        if(a.length>=8 && !/maps|google|place|data=|entry=|query=/i.test(a)) return a;
      }
    }
    if(_hasUrl(decoded)) return '';
    const m=withoutUrl.match(addrRe);
    return m?_cleanAddress(m[1]):'';
  };
  function _formatReverseAddress(display){
    let s=String(display||'').replace(/, /g,' ').replace(/,/g,' ').replace(/\\s+/g,' ').trim();
    if(!s)return '';
    s=s.replace(/\\b\\d{3}-?\\d{4}\\b/g,'').replace(/日本|Japan/gi,'').replace(/\\s+/g,' ').trim();
    const tokens=s.split(' ').filter(Boolean);
    let prefIndex=-1;
    for(let i=0;i<tokens.length;i++){if(new RegExp('^('+pref+')$').test(tokens[i])){prefIndex=i;break;}}
    if(prefIndex>=0){
      const before=tokens.slice(0,prefIndex).reverse();
      const after=tokens.slice(prefIndex);
      s=after.concat(before).join('');
    }else{
      s=tokens.join('');
    }
    return _cleanAddress(s);
  }
  async function _reverseAddressFromCoords(coords){
    if(!coords)return '';
    try{
      if(typeof reverseGeo==='function'){
        const a=await reverseGeo(coords.lat,coords.lng);
        return _formatReverseAddress(a);
      }
    }catch(e){}
    try{
      const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat='+encodeURIComponent(coords.lat)+'&lon='+encodeURIComponent(coords.lng)+'&accept-language=ja');
      const d=await r.json();
      return _formatReverseAddress(d.display_name||'');
    }catch(e){return ''}
  }
  window.parseGooglePaste=function(text){return {coords:extractCoords(text),label:extractPlaceLabel(text),address:extractAddress(text),route:parseRouteTextCore(text)}};
  window.applyParsedToStart=async function(parsed){
    if(parsed.label&&!document.getElementById('startName').value.trim())document.getElementById('startName').value=parsed.label;
    if(!parsed.address && parsed.coords)parsed.address=await _reverseAddressFromCoords(parsed.coords);
    if(parsed.address)document.getElementById('startAddress').value=parsed.address;
    if(parsed.coords){document.getElementById('startLat').value=parsed.coords.lat;document.getElementById('startLng').value=parsed.coords.lng;}
  };
  window.applyParsedToDest=async function(id,parsed){
    if(!parsed.address && parsed.coords)parsed.address=await _reverseAddressFromCoords(parsed.coords);
    destinations=destinations.map(function(d){
      if(d.id!==id)return d;
      const nd=Object.assign({},d);
      if(parsed.label&&!nd.name)nd.name=parsed.label;
      if(parsed.address)nd.address=parsed.address;
      if(parsed.coords){nd.lat=parsed.coords.lat;nd.lng=parsed.coords.lng;nd.source=parsed.address?'Google URL＋住所逆引き':'Google URL';}
      return nd;
    });
  };
  window.applyPasteToStart=async function(){
    const text=document.getElementById('startPaste').value;
    const p=parseGooglePaste(text);
    document.getElementById('startPasteStatus').textContent='貼付内容を解析中...';
    await applyParsedToStart(p);
    const parts=[];
    if(p.coords)parts.push('座標 '+p.coords.lat+', '+p.coords.lng);
    if(p.address)parts.push('住所逆引き');
    if(p.label)parts.push('名称候補');
    if(p.route.distanceKm||p.route.durationMin||p.route.tollYen){parsedRouteOverride=p.route;parts.push('ルート情報');}
    document.getElementById('startPasteStatus').textContent=parts.length?'反映：'+parts.join(' / '):'抽出できませんでした';
    render();
  };
  window.applyPasteToDest=async function(id){
    const d=destinations.find(function(x){return x.id===id});if(!d)return;
    const text=d.paste||'';
    const p=parseGooglePaste(text);
    const st=document.getElementById('st_'+id);if(st)st.textContent='貼付内容を解析中...';
    await applyParsedToDest(id,p);
    if(p.route.distanceKm||p.route.durationMin||p.route.tollYen)parsedRouteOverride=p.route;
    renderDests();render();
    if(st)st.textContent='';
    if(p.coords&&p.address)notice('座標と住所を反映しました。住所は座標から逆引きしています。');
    else if(p.coords)notice('座標のみ反映しました。住所逆引きができない地点です。');
    else notice((p.address||p.label||p.route.distanceKm||p.route.durationMin||p.route.tollYen)?'貼付内容を反映しました。':'貼付内容から抽出できませんでした。');
  };
  window.getAddressFromDestCoords=async function(id){
    const d=destinations.find(function(x){return x.id===id});if(!d||d.lat===''||d.lng===''){notice('緯度・経度が必要です。');return;}
    const st=document.getElementById('st_'+id);if(st)st.textContent='住所逆引き中...';
    const address=await _reverseAddressFromCoords({lat:Number(d.lat),lng:Number(d.lng)});
    if(address){destinations=destinations.map(function(x){return x.id===id?Object.assign({},x,{address:address,source:'住所逆引き'}):x});renderDests();render();notice('座標から住所を反映しました。');}
    else{notice('座標から住所を取得できませんでした。');}
    if(st)st.textContent='';
  };
  function _coord(p){return Number(p.lat).toFixed(6)+','+Number(p.lng).toFixed(6)}
  function _isCoord(p){return p&&p.lat!==''&&p.lng!==''&&Number.isFinite(Number(p.lat))&&Number.isFinite(Number(p.lng))}
  window.buildGoogleRouteUrl=function(){
    const c=calc();
    const pts=[c.start].concat(c.ordered).filter(_isCoord);
    if(pts.length<2)return null;
    const path=pts.map(function(p){return encodeURIComponent(_coord(p))}).join('/');
    const center=pts[0];
    return 'https://www.google.com/maps/dir/'+path+'/@'+_coord(center)+',12z/data=!3m1!4b1!4m2!4m1!3e0';
  };
  window.openGoogleRoute=function(){
    const url=buildGoogleRouteUrl();
    if(!url){notice('出発地と目的地の座標が必要です。');return;}
    try{navigator.clipboard&&navigator.clipboard.writeText(url).catch(function(){});}catch(e){}
    window.open(url,'_blank','noopener,noreferrer');
    notice('座標固定形式でGoogleルートを開きました。URLをクリップボードにもコピーしています。');
  };
  window.copyGoogleRouteUrl=function(){
    const url=buildGoogleRouteUrl();
    if(!url){notice('出発地と目的地の座標が必要です。');return;}
    navigator.clipboard.writeText(url).then(function(){notice('GoogleルートURLをコピーしました。')},function(){prompt('このURLをコピーしてください',url)});
  };
  const oldRenderDests=window.renderDests;
  if(oldRenderDests){
    window.renderDests=function(){
      oldRenderDests();
      destinations.forEach(function(d){
        const st=document.getElementById('st_'+d.id);
        if(st && !document.getElementById('addrReverse_'+d.id)){
          const b=document.createElement('button');
          b.id='addrReverse_'+d.id;
          b.className='btn secondary mini';
          b.textContent='座標から住所取得';
          b.onclick=function(){getAddressFromDestCoords(d.id)};
          st.parentElement.insertBefore(b,st);
        }
      });
    };
  }
  const oldRenderMiniRoute=window.renderMiniRoute;
  if(oldRenderMiniRoute){
    window.renderMiniRoute=function(c){
      oldRenderMiniRoute(c);
      const routeBox=document.getElementById('routeMini');
      if(routeBox && c && c.rows && c.rows.length){
        const tools=routeBox.querySelector('.routeTools');
        if(tools && !document.getElementById('copyGoogleRouteUrlBtn')){
          const b=document.createElement('button');
          b.id='copyGoogleRouteUrlBtn';
          b.className='btn secondary mini';
          b.textContent='GoogleルートURLコピー';
          b.onclick=copyGoogleRouteUrl;
          tools.appendChild(b);
        }
      }
    };
  }
  if(typeof renderDests==='function')renderDests();
  if(typeof render==='function')render();
  if(typeof notice==='function')notice('v6を適用しました。Google URLから座標を取得し、住所は座標から逆引きします。');
})();
<\/script>`;
  try{
    let html=await (await fetch(baseUrl,{cache:'no-store'})).text();
    html=html.replace('この順でGoogleルートを開く','この順でGoogleルートを開く（座標固定）');
    html=html.replace('</body>',patch+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<div class="err"><b>読み込みに失敗しました。</b><br>ブラウザを更新してください。<br>'+String(e)+'</div>';
  }
})();
</script>
</body>
</html>
